[project]
name = "dsa4213-assignment"
version = "0.1.0"
description = "DSA4213 Assignment 1: language models, embeddings and representations on Amazon beauty reviews"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "certifi>=2024.2.2",
    "fast-langdetect>=1.0.1",
    "gensim>=4.4",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pyyaml>=6",
    "scipy>=1.13",
    "torch>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
